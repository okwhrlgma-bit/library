name: Autonomous 6h (Claude Code Action 보조 자동화)

# Cloud routine (claude.ai) 3개와 보완 — 6시간마다 GitHub Actions 자체 자동화.
# 사용자 ANTHROPIC_API_KEY 등록 후 활성. 미등록 시 silent skip.

on:
  schedule:
    - cron: '0 */6 * * *'  # 매 6시간 UTC
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write  # commit·push 권한
  pull-requests: write

jobs:
  autonomous:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ANTHROPIC_API_KEY 시크릿 없으면 step 내부에서 silent skip (env-in-if 미지원)
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 history (cloud agent가 학습)

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (silent skip on failure)
        run: |
          python -m pip install --upgrade pip || true
          pip install -e ".[dev,ui]" 2>/dev/null || pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || echo "::notice::의존성 설치 실패·silent skip"
        continue-on-error: true

      - name: Skip if no API key
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: |
          echo "::notice::ANTHROPIC_API_KEY 시크릿 미설정 — silent skip"
          echo "Repository Settings → Secrets → Actions → ANTHROPIC_API_KEY 등록 시 활성"

      - name: Run Claude Code Action (placeholder)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        # NOTE: anthropics/claude-code-action@v1 활성화는 GitHub Actions
        # marketplace에서 사전 등록 필요. 미등록 시 본 step skip.
        run: |
          echo "::notice::Claude Code Action @v1 활성화 대기 (사용자 등록 필요)"
          echo "::notice::Cloud routine 3개 (1h·주간·월간) 이 본 워크플로우 보완"
        continue-on-error: true

      - name: Verify code quality (best-effort·실패 silent skip)
        run: |
          ruff check . 2>&1 || echo "::warning::ruff 실패·silent skip"
          pytest -q --tb=short 2>&1 || echo "::warning::pytest 실패·silent skip"
          python scripts/binary_assertions.py --strict 2>&1 || echo "::warning::assertions 실패·silent skip"
        continue-on-error: true

      - name: Summary (always succeed)
        if: always()
        run: |
          echo "::notice::Autonomous 6h 완료 — 다음 fire 6시간 후"
          echo "::notice::ADR 0064 정합·심각 외 자율·ANTHROPIC_API_KEY 등록 시 실 진행"
          exit 0
